version:
  stage: prepare
  needs: [ci-runtime]
  variables:
    CI_RUNTIME: none
  script:
    - mkdir -p artifacts
    - BUILD_MODIFIED=false bash scripts/build_metadata.sh > artifacts/build.env
  artifacts:
    expire_in: 4 hours
    paths: [artifacts/build.env]
    reports:
      dotenv: artifacts/build.env

go-test-cache:
  stage: prepare
  needs: [ci-runtime]
  timeout: 20 minutes
  variables:
    CI_RUNTIME: none
    CI_GO_CACHE_ENABLED: "true"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  cache:
    key: go-v1-linux-amd64-$CI_PROJECT_ID-source-$CI_MERGE_REQUEST_SOURCE_PROJECT_ID-mr-$CI_MERGE_REQUEST_IID
    paths: [.cache/ci-go/]
    policy: pull-push
    when: on_success
  script:
    - python3 scripts/ci_go_cache_test.py
    - bash scripts/ci_go_cache_prime.sh
  artifacts:
    paths: []

lint:
  stage: lint
  needs: [ci-runtime]
  variables:
    CI_RUNTIME: none
    GOLANGCI_LINT_CACHE: $CI_PROJECT_DIR/.cache/golangci-lint
  cache:
    key:
      prefix: lint-v1-$GOTOOLCHAIN-$CI_PROJECT_ID-source-$CI_MERGE_REQUEST_SOURCE_PROJECT_ID-mr-$CI_MERGE_REQUEST_IID-ref-$CI_COMMIT_REF_SLUG-protected-$CI_COMMIT_REF_PROTECTED
      files: [scripts/install_golangci_lint.sh, .golangci.yml]
    paths: [.cache/golangci-lint/]
    policy: pull-push
    when: on_success
  script:
    - make templ-generate swagger-ui-copy lint
    - go vet ./...
    - test -z "$(git ls-files -z '*.go' | xargs -0 gofmt -l)"
    - make golines-check
    - hadolint --failure-threshold warning Dockerfile

images:
  stage: prepare
  needs: [ci-runtime, version]
  timeout: 30 minutes
  script:
    - bash scripts/ci_image.sh
  artifacts:
    when: always
    expire_in: 4 hours
    paths: [artifacts/image-evidence/, artifacts/built-image-amd64/, artifacts/image.env]
    reports:
      dotenv: artifacts/image.env

# Keep the handoff short and retain successful images for prompt publication.
retain-image:
  stage: verify
  needs: [ci-runtime, images]
  rules:
    - if: '$CI_COMMIT_REF_PROTECTED == "true" && ($CI_PIPELINE_SOURCE == "push" || $CI_PIPELINE_SOURCE == "web") && ($CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH || $CI_COMMIT_TAG)'
  variables:
    CI_RUNTIME: none
  script:
    - test -s artifacts/built-image-amd64/image.tar
    - test -s artifacts/built-image-amd64/source.json
  artifacts:
    when: on_success
    expire_in: 4 hours
    paths: [artifacts/built-image-amd64/, artifacts/image.env]
    reports:
      dotenv: artifacts/image.env

publish-images:
  extends: .publish
  needs:
    - ci-runtime
    - version
    - job: lint
      artifacts: false
    - job: security-scan
      artifacts: false
    - job: container-security
      artifacts: false
    - retain-image
  timeout: 30 minutes
  script:
    - bash scripts/ci_publish.sh images

publish-chart:
  extends: .publish
  needs:
    - ci-runtime
    - version
    - job: lint
      artifacts: false
    - job: security-scan
      artifacts: false
    - job: container-security
      artifacts: false
    - job: publish-images
      artifacts: false
  timeout: 30 minutes
  script:
    - bash scripts/ci_publish.sh chart

release-page:
  stage: release
  dependencies: [ci-runtime, version]
  interruptible: false
  resource_group: release-publication
  variables:
    CI_RUNTIME: none
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_REF_PROTECTED == "true" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  script:
    - node scripts/ci_release.mjs
