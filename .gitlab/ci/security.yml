container-security:
  rules:
    - if: '$HTTPS_SECURITY_ONLY == "true"'
      when: never
    - when: on_success
  stage: scan
  needs: [ci-runtime]
  timeout: 30 minutes
  variables:
    CI_RUNTIME: none
  script:
    - make trivy-tools
    - |
      result=0
      make container-scan-test || result=1
      bash scripts/container_scan.sh config . artifacts/container/config || result=1
      bash scripts/check-agent-compose-contract.sh || result=1
      bash scripts/container_scan.sh dependencies . artifacts/container/dependencies || result=1
      exit "$result"
  artifacts:
    when: always
    expire_in: 7 days
    paths: [artifacts/container/]

security-scan:
  rules:
    - if: '$HTTPS_SECURITY_ONLY == "true"'
      when: never
    - when: on_success
  stage: scan
  needs: [ci-runtime]
  timeout: 30 minutes
  variables:
    CI_RUNTIME: none
    KUBERNETES_MEMORY_LIMIT: "6Gi"
    # Leave memory for compiler subprocesses within the job's memory limit.
    GOMEMLIMIT: 2GiB
  script:
    - bash scripts/check-ci-contract.sh
    - make security-tools templ-generate swagger-ui-copy
    - |
      if [[ $CI_PIPELINE_SOURCE == merge_request_event ]]; then
        make security-scan-test
        bash scripts/go_test.sh -race -count=1 -run '^TestAPITokenTelemetryE2E$' ./internal/handler/api
        export SECURITY_GIT_RANGE="${CI_MERGE_REQUEST_DIFF_BASE_SHA:?}..${CI_COMMIT_SHA:?}"
      fi
      result=0
      for scanner in govulncheck gosec gitleaks; do
        bash scripts/security_scan.sh "$scanner" || result=1
      done
      exit "$result"
  artifacts:
    when: always
    expire_in: 7 days
    paths: [artifacts/security/]

transport-security:
  stage: scan
  needs: [ci-runtime]
  timeout: 30 minutes
  variables:
    DEV_STACK_RUNTIME: docker
    DEV_STACK_SOCKET: /var/run/docker.sock
    DURPDEPLOY_CONTAINER_RUNTIME: docker
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      variables:
        TRANSPORT_MODE: quick
    - if: '$CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "schedule"'
      variables:
        TRANSPORT_MODE: full
  script:
    - make templ-generate swagger-ui-copy
    - make transport-security-contract
    - bash scripts/https_security_test.sh "$TRANSPORT_MODE"
    - if [[ $TRANSPORT_MODE == full ]]; then bash scripts/transport_cleanup_test.sh; fi
  artifacts:
    when: always
    expire_in: 7 days
    paths: [artifacts/transport/]
