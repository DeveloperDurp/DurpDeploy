sonar.projectKey=developerdurp_durpdeploy
sonar.organization=developerdurp
sonar.go.coverage.reportPaths=coverage.out
sonar.sources=.
sonar.exclusions=**/*_test.go
sonar.tests=.
sonar.test.inclusions=**/*_test.go,internal/testdns/**,internal/testenv/**,internal/testutil/sqlitefixture/**,scripts/*.mjs,scripts/*_test.py,scripts/run_named_go_tests_verify.go,scripts/go_test_cleanup.go
# Browser and HTTP adapters are exercised by end-to-end tests that do not emit
# Go or LCOV coverage. Generated sqlc output has no independent behavior.
# Keep all of these sources in static analysis.
# variables.js, step-variables.js, navigation.js, and deployment-logs.js use
# the same browser coverage as app.js.
# CI scripts, the release workflow, and the Makefile are exercised by
# the CI e2e job and the verify gate; neither emits Go or LCOV
# coverage, so they must not count against the new-code coverage gate.
# Bundled PowerShell and Python templates run through deployment API fixtures.
# Those processes do not emit coverage for the Go coverage reports.
# Exclude only these script files from coverage. Keep their static analysis.
sonar.coverage.exclusions=static/js/app.js,static/js/variables.js,static/js/step-variables.js,static/js/navigation.js,static/js/deployment-logs.js,scripts/mfa_browser_test.mjs,**/*_qa.mjs,internal/db/**,internal/handler/**,cmd/server/main.go,views/**,scripts/*.sh,scripts/*.py,.gitlab/**,.gitlab-ci.yml,Makefile,internal/repository/template_library/*.ps1,internal/repository/template_library/*.py

# sqlc output repeats query boilerplate and is not hand-maintained.
sonar.cpd.exclusions=internal/db/**

# Optional SMTP transport is an accepted compatibility policy.
# Plaintext success produces a visible delivery warning.
# Advertised STARTTLS verifies certificates and fails closed on TLS errors.
# This exception covers S5332, including future occurrences, only in smtp.go.
sonar.issue.ignore.multicriteria=smtpOptionalTLS,deploymentEmptyString,projectGroupEmptyString,ciBrowserRoot,ciHelperRoot,loginDestinationCookiePolicy,secretExportSQLServerVarchar
sonar.issue.ignore.multicriteria.smtpOptionalTLS.ruleKey=go:S5332
sonar.issue.ignore.multicriteria.smtpOptionalTLS.resourceKey=internal/notify/smtp.go

# Oracle treats empty strings as NULL. SQLite, PostgreSQL, and SQL Server do not.
# The deployment queries compare a non-null token ID with the empty-string sentinel.
# Apply this Oracle-specific rule exception only to these deployment queries.
sonar.issue.ignore.multicriteria.deploymentEmptyString.ruleKey=plsql:NullComparison
sonar.issue.ignore.multicriteria.deploymentEmptyString.resourceKey=queries/deployments.sql

# Project catalogs use the same non-null token ID and empty-string sentinel.
# All three supported databases distinguish empty strings from NULL.
sonar.issue.ignore.multicriteria.projectGroupEmptyString.ruleKey=plsql:NullComparison
sonar.issue.ignore.multicriteria.projectGroupEmptyString.resourceKey=queries/project_groups.sql

# These disposable CI images require root for checkout copies, fixture ownership,
# the private Docker daemon, and switching to the rootless Podman identity.
# The published application image still declares USER 10001:10001.
sonar.issue.ignore.multicriteria.ciBrowserRoot.ruleKey=docker:S6471
sonar.issue.ignore.multicriteria.ciBrowserRoot.resourceKey=Dockerfile.mobile-browser
sonar.issue.ignore.multicriteria.ciHelperRoot.ruleKey=docker:S6471
sonar.issue.ignore.multicriteria.ciHelperRoot.resourceKey=Dockerfile.ci

# Navigation cookies follow the existing configured HTTPS policy.
# HTTPS enables Secure. Explicit non-loopback HTTP configuration is rejected.
# Loopback HTTP and an unset public URL retain the development policy.
# Both cookies set HttpOnly, SameSite=Lax, and a bounded or expired lifetime.
# Evidence: mfa/config.go and handler/login_destination_test.go.
sonar.issue.ignore.multicriteria.loginDestinationCookiePolicy.ruleKey=go:S2092
sonar.issue.ignore.multicriteria.loginDestinationCookiePolicy.resourceKey=internal/handler/login_destination.go

# SQL Server supports VARCHAR. VARCHAR2 is an Oracle type.
sonar.issue.ignore.multicriteria.secretExportSQLServerVarchar.ruleKey=plsql:VarcharUsageCheck
sonar.issue.ignore.multicriteria.secretExportSQLServerVarchar.resourceKey=migrations/mssql/054_secret_exports.sql
