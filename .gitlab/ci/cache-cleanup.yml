cache-cleanup:
  stage: prepare
  # Node.js 24.22.1 on Debian Bookworm.
  image: harbor.durp.info/dockerhub/library/node:24.22.1-bookworm@sha256:d862bb5d082c5ae0210ac07e8c0344cb8cf7bef6d78e9b8c50c179da923108ea
  needs: []
  interruptible: false
  resource_group: mr-cache-cleanup
  timeout: 10 minutes
  before_script:
    - unset SONAR_TOKEN GHCR_TOKEN GHCR_USER
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - .gitlab/ci/cache-cleanup.yml
        - scripts/ci_cache_cleanup*.mjs
      variables:
        CI_CACHE_CLEANUP_DRY_RUN: "true"
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $CI_CACHE_CLEANUP == "true" && $CI_COMMIT_REF_PROTECTED == "true" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  script:
    - if [ "$CI_PIPELINE_SOURCE" = schedule ]; then node --test scripts/ci_cache_cleanup.test.mjs; fi
    - node scripts/ci_cache_cleanup.mjs
  artifacts:
    when: always
    expire_in: 1 day
    paths: [artifacts/cache-cleanup/]
