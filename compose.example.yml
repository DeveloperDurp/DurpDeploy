# DurpDeploy example Compose stack.
#
# What this is:
#   A Docker Compose v2 stack that runs durpdeploy (Go + SQLite) behind the
#   Caddy reverse proxy, with Litestream continuously replicating the SQLite
#   database to S3-compatible storage.
#
# How to bootstrap:
#   1. Copy this file to compose.yml:
#        cp compose.example.yml compose.yml
#   2. Create three env files in this directory:
#      compose.app.env, compose.litestream.env, and compose.caddy.env.
#   3. Generate an encryption key and keep it secret:
#        mkdir -p secrets
#        openssl rand -base64 32 > secrets/durpdeploy_key
#        chmod 0600 secrets/durpdeploy_key
#   4. Create a Litestream config at deploy/litestream.example.yml (see
#      systemd/litestream.yml for a starting template). At minimum set the
#      S3 bucket, path, region, and credentials.
#   5. If your Caddyfile still proxies to `localhost:8080`, change the
#      `reverse_proxy` line to `app:8080` so Caddy can reach the app container.
#   6. Build and start the stack:
#        docker compose up -d --build
#
# Optional remote agent profile:
#   7. Create compose.agent.env from the agent section in docs/deploy.md, then
#        docker compose --profile agent up -d --build agent
#      This profile has its own state volume and no server storage, secrets, or
#      Docker socket. Production agents should run on a separate network.
#
# Caddy env file (compose.caddy.env) required:
#   DURPDEPLOY_URL=https://durpdeploy.example.com
#   BACKEND=app:8080
#
# App env file optional:
#   # only set if you are NOT using secrets/durpdeploy_key
#   DURPDEPLOY_SECRET_KEY=REPLACE_WITH_BASE64_32_BYTE_KEY
#   DURPDEPLOY_SMTP_HOST=<host>
#   DURPDEPLOY_SMTP_PORT=<port>
#   DURPDEPLOY_SMTP_FROM=<from-address>
#   DURPDEPLOY_SMTP_USER=<user>
#   DURPDEPLOY_SMTP_PASS=<pass>
#   DURPDEPLOY_EXTRA_SCRUB_PATTERNS=<comma-separated-patterns>
#   DURPDEPLOY_AUDIT_RETENTION_DAYS=<days>
#   DURPDEPLOY_LITESTREAM_CHECK_COMMAND=<healthcheck-command>
#   DURPDEPLOY_LITESTREAM_CHECK_INTERVAL=<1h>
#
# Optional OIDC SSO (set all in compose.app.env together, or omit all):
#   DURPDEPLOY_URL=https://durpdeploy.example.com
#   DURPDEPLOY_OIDC_ISSUER=https://idp.example.com/realms/example
#   DURPDEPLOY_OIDC_CLIENT_ID=durpdeploy-example
#   DURPDEPLOY_OIDC_CLIENT_SECRET=REPLACE_WITH_CLIENT_SECRET
#   DURPDEPLOY_OIDC_ADMIN_GROUP=durpdeploy-admin
#   DURPDEPLOY_OIDC_DEPLOYER_GROUP=durpdeploy-deployer
#   DURPDEPLOY_OIDC_VIEWER_GROUP=durpdeploy-viewer
#   DURPDEPLOY_OIDC_DISPLAY_NAME=SSO
#   DURPDEPLOY_OIDC_GROUP_CLAIM=groups
#   DURPDEPLOY_OIDC_REQUIRE_EMAIL_VERIFIED=false  # default true
#   # Callback: https://durpdeploy.example.com/login/oidc/callback
#   # Scopes: openid profile email
#
# Required in compose.litestream.env:
#   LITESTREAM_S3_BUCKET=my-durpdeploy-backups
#
# Optional in compose.litestream.env:
#   LITESTREAM_S3_ENDPOINT=https://s3.example.com
#   AWS_ACCESS_KEY_ID=<access-key-id>
#   AWS_SECRET_ACCESS_KEY=<secret-access-key>

services:
  app:
    # The Go binary image built from ./Dockerfile.
    build: .
    image: durpdeploy:latest
    restart: unless-stopped
    # Port 8080 is internal only — Caddy talks to it over the compose network.
    # Don't publish it to the host.
    env_file:
      - ./compose.app.env
    environment:
      - DURPDEPLOY_DB=/data/durpdeploy.db
    volumes:
      - durpdeploy-data:/data
    secrets:
      - source: durpdeploy_key
        target: /etc/durpdeploy/key
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8080/login"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 256
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    env_file:
      - ./compose.caddy.env
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      app:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    cap_add:
      - NET_BIND_SERVICE
    read_only: true
    tmpfs:
      - /tmp:size=32m
    mem_limit: 256m
    cpus: 0.5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  litestream:
    image: litestream/litestream:0.3
    restart: unless-stopped
    command: replicate -config /etc/litestream.yml
    env_file:
      - ./compose.litestream.env
    volumes:
      - durpdeploy-data:/data
      - ./deploy/litestream.example.yml:/etc/litestream.yml:ro
    depends_on:
      app:
        condition: service_healthy
    # Note: Litestream 0.3's `replicate` command does not expose an HTTP monitor
    # by default. If you want DURPDEPLOY_LITESTREAM_CHECK_COMMAND to poll live
    # status, run `litestream monitor -http :9720` as a second command in the
    # litestream service (or set up a separate sidecar). The default empty value
    # means the app skips backup health checks.
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    mem_limit: 128m
    cpus: 0.25
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  agent:
    # Optional remote execution agent. Enable with --profile agent.
    profiles: [agent]
    build:
      context: .
      dockerfile: Dockerfile.agent
    image: durpdeploy-agent:latest
    restart: unless-stopped
    env_file:
      - ./compose.agent.env
    environment:
      DURPDEPLOY_AGENT_STATE_DIR: /var/lib/durpdeploy-agent
    volumes:
      - durpdeploy-agent-state:/var/lib/durpdeploy-agent
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 128
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  durpdeploy-data:
  caddy-data:
  caddy-config:
  durpdeploy-agent-state:

secrets:
  durpdeploy_key:
    file: ./secrets/durpdeploy_key  # operator creates this file with: openssl rand -base64 32 > secrets/durpdeploy_key && chmod 0600 secrets/durpdeploy_key
