sonar.projectKey=developerdurp_durpdeploy
sonar.organization=developerdurp
sonar.go.coverage.reportPaths=coverage.out
sonar.sources=.
sonar.exclusions=**/*_test.go
sonar.tests=.
sonar.test.inclusions=**/*_test.go,**/*_test.mjs
# Alpine behavior is exercised by Playwright browser tests, which do not emit
# an LCOV report. Keep the source in static analysis but do not treat missing
# JavaScript instrumentation as uncovered code.
sonar.coverage.exclusions=static/js/app.js,scripts/mfa_browser_test.mjs
