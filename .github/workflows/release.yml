# Build and scan images on PRs. Promote matching artifacts after merge.
# Tests run only on PRs. Publishing runs on main, tags, or dispatch.
#
# Versioning:
#   - tag push  -> version = tag name (e.g. v1.2.3), chart version = 1.2.3
#   - main push -> version = short commit SHA
#
# Registries (defaults to ghcr.io under the repo owner; override per-fork):
#   - container: ghcr.io/<owner>/durpdeploy
#   - chart:     oci://ghcr.io/<owner>/charts/durpdeploy
name: release

on:
  push:
    branches: [main]
    tags: ['*']
  # PR runs gate the merge: lint, test, and e2e all execute per PR. The
  # artifact-publishing jobs below are event-gated to push/dispatch
  # only, so PR runs never push images, charts, or release assets.
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch: {}

# Cancel superseded PR runs. Let publishing finish once it starts.
concurrency:
  group: release-${{ github.ref }}-${{ github.event_name == 'pull_request' && 'pr' || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  IMAGE_NAME: durpdeploy
  # ghcr.io requires the repository owner segment to be all lowercase.
  # Mixed-case GitHub usernames (e.g. DeveloperDurp) fail the cache
  # exporter with "repository name (X) must be lowercase". GitHub Actions
  # has no `lower` filter on workflow expressions — the `| lower` syntax
  # renders the literal github.repository_owner unchanged, so hardcode
  # the lowercase form. Forkers must edit this line.
  REGISTRY_OWNER: developerdurp
  # ghcr.io's OCI handler treats the first path segment as the repo name;
  # nested paths (charts/durpdeploy) are rejected with
  # "invalid_reference: invalid repository". One segment, lowercase.
  CHART_REPO: charts

jobs:
  # Reuse the same-commit scanner gates for PRs, main, tags, and dispatch.
  # Both publishing jobs require success; no registry secrets reach the scan.
  security:
    uses: ./.github/workflows/security.yml
    permissions:
      contents: read

  # ----- Compute version once, share with downstream jobs ----------------
  version:
    name: Compute version
    # Cheap and harmless on PRs: computing a version string has no
    # side effects; the publishing jobs that consume it are separately
    # event-gated.
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      chart_version: ${{ steps.v.outputs.chart_version }}
      is_release: ${{ steps.v.outputs.is_release }}
    steps:
      - id: v
        env:
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          if [ "$REF_TYPE" = "tag" ]; then
            if [[ ! "$REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-((0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*)(\.(0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*))*))?(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]; then
              echo "Tag must be a valid SemVer with a v prefix" >&2
              exit 1
            fi
            # Tag name is the source of truth on releases. Strip a leading
            # 'v' for chart version (SemVer requires no v prefix).
            VERSION="$REF_NAME"
            CHART_VERSION="${VERSION#v}"
            IS_RELEASE="true"
          else
            # main / branch push: short SHA. Chart version on a non-release
            # is meaningless — pin to 0.0.0 so the helm package is valid
            # but no operator would install a non-release chart.
            VERSION="${GITHUB_SHA::7}"
            CHART_VERSION="0.0.0"
            IS_RELEASE="false"
          fi
          # Append -<sha> to chart version on non-release pushes so the
          # same SemVer chart can be re-pushed without bumping it.
          if [ "$IS_RELEASE" = "false" ]; then
            CHART_VERSION="0.0.0-${VERSION}"
          fi
          # OCI tags cannot contain '+'. Use the same tag for Helm appVersion.
          echo "version=${VERSION//+/-}" >> "$GITHUB_OUTPUT"
          echo "chart_version=$CHART_VERSION" >> "$GITHUB_OUTPUT"
          echo "is_release=$IS_RELEASE" >> "$GITHUB_OUTPUT"

  # ----- Lint ------------------------------------------------------------
  # Gate Go analysis, formatting, and Dockerfile checks before tests.
  lint:
    name: Lint
    runs-on: ubuntu-latest
    needs: [version]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.26.9'
          cache: true

      # ponytail: static/swagger-ui/ is gitignored (build artifacts from
      # node_modules/swagger-ui-dist), so the //go:embed pattern in
      # static/static.go finds no files on a fresh checkout. Materialize
      # them before any go command that walks the import graph.
      - name: Materialize static/swagger-ui/
        run: make swagger-ui-copy

      - name: go vet
        run: go tool templ generate && go vet ./...

      - name: golangci-lint
        run: make lint

      - name: gofmt
        run: |
          # Mirror CI: empty stdout == clean tree.
          out=$(gofmt -l .)
          if [ -n "$out" ]; then
            echo "Files needing gofmt:"
            echo "$out"
            exit 1
          fi

      - name: golines
        run: |
          # Same check the pre-commit hook runs on staged files, scoped
          # to the Go files this PR changes (golines' output is
          # toolchain-sensitive, so a repo-wide gate would fail on
          # main's historical formatting, not on this diff). Pinned
          # `go tool` uses the version locked in go.mod/go.sum.
          # checkout is shallow; unshallow so the merge base with main
          # is resolvable for the changed-file diff.
          git fetch --unshallow origin main
          files=$(git diff --name-only --diff-filter=ACMR origin/main...HEAD -- '*.go')
          if [ -z "$files" ]; then
            exit 0
          fi
          set -e
          out=(
            $(go tool golines -m 80 --ignore-generated -l $files)
          )
          if [ -n "$out" ]; then
            echo "Files needing golines:"
            echo "$out"
            exit 1
          fi

      - name: hadolint
        uses: hadolint/hadolint-action@2332a7b74a6de0dda2e2221d575162eba76ba5e5 # v3.3.0
        with:
          dockerfile: Dockerfile
          failure-threshold: warning

  # ----- Tests -----------------------------------------------------------
  test:
    name: Test
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.26.9'
          cache: true

      # ponytail: must run before any go command. Without it, internal/handler
      # packages that import `durpdeploy/views/components` fail to resolve
      # because the generated *_templ.go files don't exist (the same
      # requirement documented in AGENTS.md for local `go vet`/`go test`).
      - name: Generate templ files
        run: go tool templ generate

      # ponytail: static/swagger-ui/ is gitignored; materialize it before
      # the test build walks the import graph (same reason as the lint job).
      - name: Materialize static/swagger-ui/
        run: make swagger-ui-copy

      # CI's exact command — keep this in sync with AGENTS.md.
      - name: go test
        run: bash scripts/go_test.sh -v -count=1 -timeout=20m ./...

  # ----- E2E contract checks -----------------------------------------------
  e2e:
    name: E2E
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.26.9'
          cache: true

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      - name: Materialize static/swagger-ui/
        run: make swagger-ui-copy

      - name: Generate templ files
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --volume "$PWD:/workspace" \
            --workdir /workspace \
            ghcr.io/a-h/templ@sha256:2e266c40e32de7fa67e08018a06675975ccb7e86110dae7a7c0b0131adaab41d \
            generate

      - name: Install Chromium for runbook browser checks
        run: ./node_modules/.bin/playwright install --with-deps chromium

      - name: Install shell checks
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck sqlite3 skopeo zip unzip

      - name: Verify image artifact boundaries
        run: bash scripts/release_images_test.sh

      - name: Check E2E shell syntax
        run: |
          for script in scripts/e2e_test.sh scripts/e2e_lifecycle.sh scripts/e2e_wait.sh scripts/e2e_parallel_test.sh scripts/e2e_db_test.sh scripts/e2e_fixture_reset.sh scripts/e2e_fixture_reset_test.sh scripts/terraform_approval_e2e.sh scripts/e2e_server_containers.sh scripts/check_e2e_containers.sh scripts/check_e2e_containers_test.sh; do
            bash -n "$script"
          done
          shellcheck -S error scripts/e2e_test.sh scripts/e2e_lifecycle.sh scripts/e2e_wait.sh scripts/e2e_parallel_test.sh scripts/e2e_db_test.sh scripts/e2e_fixture_reset.sh scripts/e2e_fixture_reset_test.sh scripts/terraform_approval_e2e.sh scripts/e2e_server_containers.sh scripts/check_e2e_containers.sh scripts/check_e2e_containers_test.sh
          bash scripts/e2e_fixture_reset_test.sh
          bash scripts/check_e2e_containers_test.sh
          bash -n scripts/mobile-browser-image-cleanup-test.sh
          shellcheck -S error scripts/mobile-browser-image-cleanup-test.sh
          bash scripts/mobile-browser-image-cleanup-test.sh

      - name: Concurrent agent E2E isolation
        env:
          DURPDEPLOY_CONTAINER_RUNTIME: docker
        run: bash scripts/e2e_parallel_test.sh

      - name: E2E contract checks
        env:
          DURPDEPLOY_RUNBOOK_BROWSER_E2E: '1'
        run: bash ./scripts/e2e_server_containers.sh

  # Build each platform on its native runner, without registry credentials.
  images:
    name: Image scan (${{ matrix.arch }})
    if: github.event_name == 'pull_request'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
      - name: Prepare archive directory
        run: mkdir -p "$RUNNER_TEMP/release-image"
      - name: Build image archive
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          outputs: type=oci,dest=${{ runner.temp }}/release-image/image.tar
          provenance: false
          sbom: false
          push: false
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
      - name: Scan image archive
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          input: ${{ runner.temp }}/release-image/image.tar
          scanners: vuln
          format: json
          output: ${{ runner.temp }}/image-scan.json
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          severity: HIGH,CRITICAL
          cache: false
      - name: Record verified source
        env:
          ARCH: ${{ matrix.arch }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          jq -n --arg arch "$ARCH" --arg commit "$GITHUB_SHA" \
            --arg tree "$(git rev-parse HEAD^{tree})" --arg head "$PR_HEAD" --arg base "$PR_BASE" \
            --arg sha256 "$(sha256sum "$RUNNER_TEMP/release-image/image.tar" | cut -d ' ' -f 1)" \
            --argjson run "$GITHUB_RUN_ID" --argjson attempt "$GITHUB_RUN_ATTEMPT" \
            '{schema:1,arch:$arch,commit:$commit,tree:$tree,head:$head,base:$base,sha256:$sha256,run:$run,attempt:$attempt}' \
            > "$RUNNER_TEMP/release-image/source.json"
      - name: Retain scanned image
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-image-${{ matrix.arch }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-image/
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  image-verification:
    name: Image verification
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    needs: [images, test, e2e, security]
    steps:
      - name: Require completed verification
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: jq -e 'all(.[]; .result == "success")' <<< "$RESULTS"

  # Promotion performs no build or image scan. All image bytes come from PR CI.
  docker:
    name: Publish verified images
    if: >-
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [version, lint, security]
    concurrency:
      group: release-image-publication
      cancel-in-progress: false
      queue: max
    permissions:
      contents: read
      actions: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Prepare image transport
        run: |
          sudo apt-get update
          sudo apt-get install -y skopeo
      - name: Resolve verified PR images
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/resolve_release_images.sh "$RUNNER_TEMP/verified-images"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
      - name: Log in to ghcr.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish scanned images
        env:
          VERSION: ${{ needs.version.outputs.version }}
          IS_RELEASE: ${{ needs.version.outputs.is_release }}
        run: bash scripts/publish_release_images.sh "$RUNNER_TEMP/verified-images" "$VERSION"


  # ----- Helm chart (OCI) -----------------------------------------------
  # Bump appVersion in Chart.yaml to the built image's tag, package, and
  # push to ghcr.io as an OCI artifact. On tag pushes the chart's own
  # `version` is also bumped (SemVer, no leading v).
  helm:
    name: Package & push chart
    if: >-
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    needs: [version, lint, security, docker]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Helm
        uses: azure/setup-helm@59b1c81c6280f5abebb1fb1bc585696daa7dfb42 # v5
        with:
          version: v3.16.2

      - name: Log in to ghcr.io (helm)
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: |
          printf '%s' "$GHCR_TOKEN" | helm registry login \
            ghcr.io -u "$GHCR_USER" --password-stdin

      - name: Bump chart appVersion + version
        working-directory: charts/durpdeploy
        env:
          APP_VERSION: ${{ needs.version.outputs.version }}
          CHART_VERSION: ${{ needs.version.outputs.chart_version }}
        run: |
          # Rewrite Chart.yaml with sed so the diff is minimal and the
          # file stays gofmt-irrelevant (it's YAML, but be tidy).
          sed -i.bak \
            -e "s/^appVersion:.*/appVersion: \"${APP_VERSION}\"/" \
            -e "s/^version:.*/version: ${CHART_VERSION}/" \
            Chart.yaml
          rm -f Chart.yaml.bak
          cat Chart.yaml

      - name: Helm lint
        working-directory: charts/durpdeploy
        run: helm lint .

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.26.9'
          cache: true

      - name: Verify chart database connections
        run: bash scripts/go_test.sh -race -count=1 ./charts/durpdeploy

      - name: Helm package
        working-directory: charts/durpdeploy
        env:
          APP_VERSION: ${{ needs.version.outputs.version }}
          CHART_VERSION: ${{ needs.version.outputs.chart_version }}
        run: |
          helm package . \
            --app-version "$APP_VERSION" \
            --version "$CHART_VERSION"

      - name: Helm push (OCI)
        working-directory: charts/durpdeploy
        env:
          CHART_NAME: durpdeploy-${{ needs.version.outputs.chart_version }}.tgz
        run: |
          helm push "${CHART_NAME}" \
            oci://ghcr.io/${{ env.REGISTRY_OWNER }}/${{ env.CHART_REPO }}
