version:
  stage: prepare
  needs: [ci-runtime]
  variables:
    CI_RUNTIME: none
  script:
    - mkdir -p artifacts
    - BUILD_MODIFIED=false bash scripts/build_metadata.sh > artifacts/build.env
  artifacts:
    expire_in: 4 hours
    paths: [artifacts/build.env]
    reports:
      dotenv: artifacts/build.env

lint:
  stage: lint
  needs: [ci-runtime]
  variables:
    CI_RUNTIME: none
  script:
    - make templ-generate swagger-ui-copy lint
    - go vet ./...
    - test -z "$(git ls-files -z '*.go' | xargs -0 gofmt -l)"
    - make golines-check
    - hadolint --failure-threshold warning Dockerfile

images:
  stage: prepare
  needs: [ci-runtime, version]
  timeout: 30 minutes
  script:
    - bash scripts/ci_image.sh
  artifacts:
    when: always
    expire_in: 4 hours
    paths: [artifacts/image-evidence/, artifacts/built-image-amd64/, artifacts/image.env]
    reports:
      dotenv: artifacts/image.env

# Keep the handoff short and retain successful images for prompt publication.
retain-image:
  stage: verify
  needs: [ci-runtime, images]
  variables:
    CI_RUNTIME: none
  script:
    - test -s artifacts/built-image-amd64/image.tar
    - test -s artifacts/built-image-amd64/source.json
  artifacts:
    when: on_success
    expire_in: 4 hours
    paths: [artifacts/built-image-amd64/, artifacts/image.env]
    reports:
      dotenv: artifacts/image.env

image-verification:
  stage: verify
  artifacts:
    paths: []
  variables:
    CI_RUNTIME: none
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  needs:
    - ci-runtime
    - job: retain-image
      artifacts: false
    - job: security-scan
      artifacts: false
    - job: container-security
      artifacts: false
    - job: pre-commit
      artifacts: false
    - job: backup-restore
      artifacts: false
    - job: database-tls
      artifacts: false
    - job: auth-mfa-parity
      artifacts: false
    - job: agent-rollout
      artifacts: false
    - job: package-browser
      artifacts: false
    - job: artifact-stress
      artifacts: false
    - job: mobile-browser
      artifacts: false
    - job: auth-mfa-sqlite
      artifacts: false
    - job: agent-smoke
      artifacts: false
    - job: agent-container-docker
      artifacts: false
    - job: agent-container-podman
      artifacts: false
    - job: test
      artifacts: false
    - job: e2e
      artifacts: false
    - job: dev-stacks
      artifacts: false
    - job: coverage
      artifacts: false
  script:
    - printf 'All required merge request checks passed.\n'

publish-images:
  extends: .publish
  needs:
    - ci-runtime
    - version
    - job: lint
      artifacts: false
    - job: security-scan
      artifacts: false
    - job: container-security
      artifacts: false
    - retain-image
  timeout: 30 minutes
  script:
    - bash scripts/ci_publish.sh images

publish-chart:
  extends: .publish
  needs:
    - ci-runtime
    - version
    - job: lint
      artifacts: false
    - job: security-scan
      artifacts: false
    - job: container-security
      artifacts: false
    - job: publish-images
      artifacts: false
  timeout: 30 minutes
  script:
    - bash scripts/ci_publish.sh chart
