# Release pipeline: lint, test, build & push container image, package & push
# Helm chart. Runs on push to main and on any tag.
#
# Versioning:
#   - tag push  -> version = tag name (e.g. v1.2.3), chart version = 1.2.3
#   - main push -> version = short commit SHA
#
# Registries (defaults to ghcr.io under the repo owner; override per-fork):
#   - container: ghcr.io/<owner>/durpdeploy
#   - chart:     oci://ghcr.io/<owner>/charts/durpdeploy
name: release

on:
  push:
    branches: [main]
    tags: ['*']
  workflow_dispatch: {}

# Cancel any in-flight run for the same ref when a new commit lands. Saves
# CI minutes on a fast-pushed branch and prevents stale pushes winning the
# race against a newer commit.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  IMAGE_NAME: durpdeploy
  # ghcr.io requires the repository owner segment to be all lowercase.
  # Mixed-case GitHub usernames (e.g. DeveloperDurp) fail the cache
  # exporter with "repository name (X) must be lowercase". GitHub Actions
  # has no `lower` filter on workflow expressions — the `| lower` syntax
  # renders the literal github.repository_owner unchanged, so hardcode
  # the lowercase form. Forkers must edit this line.
  REGISTRY_OWNER: developerdurp
  # ghcr.io's OCI handler treats the first path segment as the repo name;
  # nested paths (charts/durpdeploy) are rejected with
  # "invalid_reference: invalid repository". One segment, lowercase.
  CHART_REPO: charts
  # Buildx cache lives in its OWN ghcr package, not alongside the image.
  # Caching into the same package pollutes it with `cache-<sha>` tags
  # whose manifest is `application/vnd.buildkit.cacheconfig.v0` — not an
  # OCI image — so `docker run`/`podman run` against that tag fails with
  # "unsupported image-specific operation on artifact with type
  # application/vnd.buildkit.cacheconfig.v0". The first run after this
  # change will not have a cache to import; subsequent runs reuse it.
  CACHE_IMAGE_NAME: durpdeploy-cache

jobs:
  # ----- Compute version once, share with downstream jobs ----------------
  version:
    name: Compute version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      chart_version: ${{ steps.v.outputs.chart_version }}
      is_release: ${{ steps.v.outputs.is_release }}
    steps:
      - id: v
        env:
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          if [ "$REF_TYPE" = "tag" ]; then
            if [[ ! "$REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-((0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*)(\.(0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*))*))?(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]; then
              echo "Tag must be a valid SemVer with a v prefix" >&2
              exit 1
            fi
            # Tag name is the source of truth on releases. Strip a leading
            # 'v' for chart version (SemVer requires no v prefix).
            VERSION="$REF_NAME"
            CHART_VERSION="${VERSION#v}"
            IS_RELEASE="true"
          else
            # main / branch push: short SHA. Chart version on a non-release
            # is meaningless — pin to 0.0.0 so the helm package is valid
            # but no operator would install a non-release chart.
            VERSION="${GITHUB_SHA::7}"
            CHART_VERSION="0.0.0"
            IS_RELEASE="false"
          fi
          # Append -<sha> to chart version on non-release pushes so the
          # same SemVer chart can be re-pushed without bumping it.
          if [ "$IS_RELEASE" = "false" ]; then
            CHART_VERSION="0.0.0-${VERSION}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "chart_version=$CHART_VERSION" >> "$GITHUB_OUTPUT"
          echo "is_release=$IS_RELEASE" >> "$GITHUB_OUTPUT"

  # ----- Lint ------------------------------------------------------------
  # Mirrors the GitLab lint stage: go vet + gofmt + hadolint.
  lint:
    name: Lint
    runs-on: ubuntu-latest
    needs: [version]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.25'
          cache: true

      - name: Install templ
        run: go install github.com/a-h/templ/cmd/templ@09d6b02946f54492f3d3dcb9729f5b792f220b40

      # ponytail: static/swagger-ui/ is gitignored (build artifacts from
      # node_modules/swagger-ui-dist), so the //go:embed pattern in
      # static/static.go finds no files on a fresh checkout. Materialize
      # them before any go command that walks the import graph.
      - name: Materialize static/swagger-ui/
        run: make swagger-ui-copy

      - name: go vet
        run: templ generate && go vet ./...

      - name: gofmt
        run: |
          # Mirror CI: empty stdout == clean tree.
          out=$(gofmt -l .)
          if [ -n "$out" ]; then
            echo "Files needing gofmt:"
            echo "$out"
            exit 1
          fi

      - name: golines
        run: |
          output=$(make golines-check)
          if [ -n "$output" ]; then
            printf '%s\n' "$output"
            exit 1
          fi

      - name: hadolint
        uses: hadolint/hadolint-action@2332a7b74a6de0dda2e2221d575162eba76ba5e5 # v3.3.0
        with:
          dockerfile: Dockerfile
          failure-threshold: warning

  # ----- Tests -----------------------------------------------------------
  test:
    name: Test
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.25'
          cache: true

      - name: Install templ
        run: go install github.com/a-h/templ/cmd/templ@09d6b02946f54492f3d3dcb9729f5b792f220b40

      # ponytail: must run before any go command. Without it, internal/handler
      # packages that import `durpdeploy/views/components` fail to resolve
      # because the generated *_templ.go files don't exist (the same
      # requirement documented in AGENTS.md for local `go vet`/`go test`).
      - name: Generate templ files
        run: templ generate

      # ponytail: static/swagger-ui/ is gitignored; materialize it before
      # the test build walks the import graph (same reason as the lint job).
      - name: Materialize static/swagger-ui/
        run: make swagger-ui-copy

      # CI's exact command — keep this in sync with AGENTS.md.
      - name: go test
        run: go test -v -count=1 ./...

  # ----- Container image (multi-arch) ------------------------------------
  # Buildx with the docker-container driver, registry cache, push to ghcr.
  # Mirrors the GitLab docker:build stage. Tags are computed from the
  # shared `version` job: tag pushes get vX.Y.Z, main pushes get <sha>.
  docker:
    name: Build & push image
    runs-on: ubuntu-latest
    needs: [version, test]
    permissions:
      contents: read
      packages: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Log in to ghcr.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ghcr.io/${{ env.REGISTRY_OWNER }}/${{ env.IMAGE_NAME }}
          # Only the primary version is interesting here; ghcr retains
          # the multi-tag history under digest refs.
          tags: |
            type=raw,value=${{ needs.version.outputs.version }}
            type=raw,value=latest,enable=${{ needs.version.outputs.is_release == 'true' }}

      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # ponytail: cache lives in its own package (CACHE_IMAGE_NAME),
          # not in the image package — see env comment. mode=max on push
          # so all intermediate layers are exported; cache-from mode=max
          # so all of them are pulled back in. Per-SHA refs let concurrent
          # branches run without racing on the same tag and avoid the
          # "package.json: not found" cache-key error that a shared `cache`
          # tag hit during the early mixed-case-owner runs.
          cache-from: type=registry,ref=ghcr.io/${{ env.REGISTRY_OWNER }}/${{ env.CACHE_IMAGE_NAME }}:cache-${{ github.sha }},mode=max
          cache-to: type=registry,ref=ghcr.io/${{ env.REGISTRY_OWNER }}/${{ env.CACHE_IMAGE_NAME }}:cache-${{ github.sha }},mode=max

      - name: Trivy scan
        # ponytail: aquasec org was renamed to aquasecurity; 0.28.0 is one
        # of the 76 tags compromised in the March 2026 supply-chain
        # attack — only 0.35.0+ are post-incident, and 0.36.0 is current.
        # GitHub Actions requires the `v` prefix on bare SemVer tags —
        # The prefixed release ref is required for this action.
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ghcr.io/${{ env.REGISTRY_OWNER }}/${{ env.IMAGE_NAME }}:${{ needs.version.outputs.version }}
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'HIGH,CRITICAL'


  # ----- Helm chart (OCI) -----------------------------------------------
  # Bump appVersion in Chart.yaml to the built image's tag, package, and
  # push to ghcr.io as an OCI artifact. On tag pushes the chart's own
  # `version` is also bumped (SemVer, no leading v).
  helm:
    name: Package & push chart
    runs-on: ubuntu-latest
    needs: [version, test]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5
        with:
          version: v3.16.2

      - name: Log in to ghcr.io (helm)
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login \
            ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Bump chart appVersion + version
        working-directory: charts/durpdeploy
        env:
          APP_VERSION: ${{ needs.version.outputs.version }}
          CHART_VERSION: ${{ needs.version.outputs.chart_version }}
        run: |
          # Rewrite Chart.yaml with sed so the diff is minimal and the
          # file stays gofmt-irrelevant (it's YAML, but be tidy).
          sed -i.bak \
            -e "s/^appVersion:.*/appVersion: \"${APP_VERSION}\"/" \
            -e "s/^version:.*/version: ${CHART_VERSION}/" \
            Chart.yaml
          rm -f Chart.yaml.bak
          cat Chart.yaml

      - name: Helm lint
        working-directory: charts/durpdeploy
        run: helm lint .

      - name: Helm package
        working-directory: charts/durpdeploy
        env:
          APP_VERSION: ${{ needs.version.outputs.version }}
          CHART_VERSION: ${{ needs.version.outputs.chart_version }}
        run: |
          helm package . \
            --app-version "$APP_VERSION" \
            --version "$CHART_VERSION"

      - name: Helm push (OCI)
        working-directory: charts/durpdeploy
        env:
          CHART_NAME: durpdeploy-${{ needs.version.outputs.chart_version }}.tgz
        run: |
          helm push "${CHART_NAME}" \
            oci://ghcr.io/${{ env.REGISTRY_OWNER }}/${{ env.CHART_REPO }}
