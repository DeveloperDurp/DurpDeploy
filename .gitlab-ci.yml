include:
  - local: .gitlab/ci/test.yml
    rules: &regular_pipeline_rules
      - if: '$CI_PIPELINE_SOURCE == "schedule" && $CI_CACHE_CLEANUP == "true"'
        when: never
      - when: always
  - local: .gitlab/ci/security.yml
    rules: *regular_pipeline_rules
  - local: .gitlab/ci/release.yml
    rules: *regular_pipeline_rules
  - local: .gitlab/ci/sonarcloud.yml
    rules: *regular_pipeline_rules
  - local: .gitlab/ci/cache-cleanup.yml

workflow:
  auto_cancel:
    on_new_commit: interruptible
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "push" && ($CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH || $CI_COMMIT_TAG)'
      auto_cancel:
        on_new_commit: none
    - if: '$CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "schedule"'
      auto_cancel:
        on_new_commit: none

stages: [prepare, lint, test, scan, verify, publish]

variables:
  BUILDX_NO_DEFAULT_OCI_ARTIFACT: "1"
  GIT_DEPTH: "0"
  GIT_SUBMODULE_STRATEGY: none
  FF_GIT_URLS_WITHOUT_TOKENS: "true"
  GOFLAGS: -mod=readonly -p=2
  GOMAXPROCS: "2"
  GOTOOLCHAIN: go1.26.9
  GOMODCACHE: /opt/go-mod
  GOCACHE: /opt/go-build
  TESTCONTAINERS_HUB_IMAGE_NAME_PREFIX: harbor.durp.info/dockerhub
  NODE_PATH: /opt/mobile-browser/node_modules
  CI_RUNTIME: docker
  CI_JOB_TEMP: /tmp/durpdeploy-ci
  DOCKER_HOST: unix:///var/run/docker.sock
  DURPDEPLOY_CONTAINER_URL: unix:///var/run/docker.sock
  DURPDEPLOY_CONTAINER_RUNTIME: docker
  REGISTRY_OWNER: developerdurp
  IMAGE_NAME: durpdeploy
  CHART_REPO: charts

default:
  image: $CI_RUNTIME_IMAGE
  interruptible: true
  before_script:
    - unset SONAR_TOKEN
    - if [[ ${CI_ENVIRONMENT_NAME:-} != production ]]; then unset GHCR_TOKEN GHCR_USER; fi
    - bash scripts/ci_prepare.sh
  cache: []
  artifacts:
    when: always
    expire_in: 7 days
    paths: [artifacts/]

.mr-test:
  stage: test
  needs: [ci-runtime, lint]
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'

.publish:
  stage: publish
  interruptible: false
  environment:
    name: production
    action: prepare
  resource_group: release-publication
  rules:
    - if: '$CI_COMMIT_REF_PROTECTED == "true" && ($CI_PIPELINE_SOURCE == "push" || $CI_PIPELINE_SOURCE == "web") && ($CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH || $CI_COMMIT_TAG)'

ci-runtime:
  rules: *regular_pipeline_rules
  stage: prepare
  image: harbor.durp.info/dockerhub/library/docker:29.9.0-cli@sha256:1a4c7cb63513f349bdad01fcc6e0f3f2f67d37b9da86f14dc0d4a0942eecda00
  services:
    - name: harbor.durp.info/dockerhub/library/docker:29.9.0-dind@sha256:0b6d18a4a222e71c88be6034926b4f6cde2fc33c2218643d03ccfddc65995470
      entrypoint: [dockerd-entrypoint.sh]
      command: [dockerd, "--host=unix:///var/run/docker.sock", "--host=tcp://127.0.0.1:2375", "--tls=false"]
      variables:
        HEALTHCHECK_TCP_PORT: "2375"
  variables:
    DOCKER_HOST: tcp://127.0.0.1:2375
    DOCKER_TLS_CERTDIR: ""
  before_script:
    - unset SONAR_TOKEN GHCR_TOKEN GHCR_USER
    - apk add --no-cache bash jq=1.8.2-r0 oniguruma=6.9.10-r0
  cache: []
  timeout: 30 minutes
  script:
    - bash scripts/ci_build_runtime.sh
  artifacts:
    expire_in: 30 days
    paths: [artifacts/runtime.env, artifacts/runtime-timing.json]
    reports:
      dotenv: artifacts/runtime.env
