{{- if and .Values.secretKey.create (not .Values.secretKey.existingSecret) -}}
{{- $secretName := include "durpdeploy.secretKeyName" . -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels:
    {{- include "durpdeploy.labels" . | nindent 4 }}
type: Opaque
# The encryption key (base64, 32 bytes). The chart ships an empty value —
# the operator MUST generate one before the first deploy:
#
#   openssl rand -base64 32
#
# and patch it in:
#
#   kubectl create secret generic {{ $secretName }} \
#     -n {{ .Release.Namespace }} \
#     --from-literal=secret-key="$(openssl rand -base64 32)" \
#     --dry-run=client -o yaml | kubectl apply -f -
#
# Without a value, the binary refuses to start. A manual Secret update
# requires an explicit Deployment restart; Helm upgrades render this value.
stringData:
  secret-key: {{ .Values.secretKey.value | default "" | quote }}
{{- end }}
