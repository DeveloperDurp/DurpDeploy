{{- if and .Values.postgres.enabled (not .Values.postgres.existingSecret) -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "durpdeploy.postgresSecretName" . }}
  labels:
    {{- include "durpdeploy.labels" . | nindent 4 }}
type: Opaque
# Postgres credentials. Configure before startup. Prefer an existing Secret
# to keep the password out of Helm values; do not commit credentials.
# To set this Secret manually:
#
#   kubectl create secret generic {{ include "durpdeploy.postgresSecretName" . }} \
#     -n {{ .Release.Namespace }} \
#     --from-literal=password="$(openssl rand -hex 32)" \
#     --dry-run=client -o yaml | kubectl apply -f -
#
# The same password must be configured in the Postgres server before
# the pod connects. Manual updates require an explicit Deployment restart.
stringData:
  password: {{ .Values.postgres.password | default "" | quote }}
{{- end }}
