version: "2"

run:
  timeout: 10m
  modules-download-mode: readonly
  tests: true

linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
  exclusions:
    generated: strict
    presets: []
    rules:
      # Test HTTP response bodies are read-only. Close still runs, including
      # expected disconnects in streaming and cancellation fixtures.
      - path: '_test\.go$'
        linters: [errcheck]
        text: '^Error return value of `[^`]*\.Body\.Close` is not checked$'
      # Keep the existing E2E lock fixture unchanged. These deferred calls
      # release its connection and its uncommitted lock transaction.
      - path: '^internal/agentserver/poll_deadlock_e2e_test\.go$'
        linters: [errcheck]
        text: '^Error return value of `(locker\.Close|tx\.Rollback)` is not checked$'

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
