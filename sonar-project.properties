sonar.projectKey=developerdurp_durpdeploy
sonar.organization=developerdurp
sonar.go.coverage.reportPaths=coverage.out
sonar.sources=.
sonar.exclusions=**/*_test.go
sonar.tests=.
sonar.test.inclusions=**/*_test.go,scripts/*.mjs,scripts/run_named_go_tests_verify.go
# Browser and HTTP adapters are exercised by end-to-end tests that do not emit
# Go or LCOV coverage. Generated sqlc output has no independent behavior.
# Keep all of these sources in static analysis.
sonar.coverage.exclusions=static/js/app.js,scripts/mfa_browser_test.mjs,**/*_qa.mjs,internal/db/**,internal/handler/**,cmd/server/main.go,views/**
