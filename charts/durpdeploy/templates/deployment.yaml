apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "durpdeploy.fullname" . }}
  labels:
    {{- include "durpdeploy.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "durpdeploy.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        # Force pod restart when the secret-key Secret content changes.
        # The binary reads the key on every boot, so a key rotation
        # becomes a rolling restart.
        checksum/secret-key: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        # Same trick for the Postgres password — pgx reads it on every
        # new connection but the binary opens a pool once at boot, so
        # the pod needs to roll for a new password to take effect.
        checksum/postgres-secret: {{ include (print $.Template.BasePath "/postgres-secret.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "durpdeploy.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "durpdeploy.serviceAccountName" . }}
      automountServiceAccountToken: false
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- if .Values.containerRuntime.enabled }}
      initContainers:
        - name: container-runtime-ssh
          image: {{ include "durpdeploy.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          command: ["/bin/sh", "-ceu"]
          args:
            - >-
              install -m 0600 /runtime-ssh-secret/id_ed25519
              /runtime-ssh/id_ed25519;
              install -m 0600 /runtime-ssh-secret/known_hosts
              /runtime-ssh/known_hosts
          volumeMounts:
            - name: container-runtime-ssh-secret
              mountPath: /runtime-ssh-secret
              readOnly: true
            - name: container-runtime-ssh
              mountPath: /runtime-ssh
      {{- end }}
      containers:
        - name: durpdeploy
          image: {{ include "durpdeploy.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ .Values.service.targetPort }}
              protocol: TCP
            - name: agent
              containerPort: {{ .Values.agent.port }}
              protocol: TCP
          env:
            # --- Database (Postgres DSN) ---
            # postgres://user:password@host:port/db?sslmode=...
            # ponytail: assembled inline rather than via a Secret+envFrom
            # because pgx accepts the full DSN as a single string and we
            # already pay the cost of building it once.
            - name: DURPDEPLOY_DB
              value: "postgres://{{ .Values.externalPostgres.username }}:$(DURPDEPLOY_PG_PASSWORD)@{{ .Values.externalPostgres.host }}:{{ .Values.externalPostgres.port }}/{{ .Values.externalPostgres.database }}?sslmode={{ .Values.externalPostgres.sslmode }}"
            - name: DURPDEPLOY_PG_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "durpdeploy.postgresSecretName" . }}
                  key: password
            # --- Encryption key ---
            - name: DURPDEPLOY_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "durpdeploy.secretKeyName" . }}
                  key: secret-key
            - name: DURPDEPLOY_AGENT_LISTEN_ADDR
              value: {{ .Values.agent.listenAddress | quote }}
            - name: DURPDEPLOY_AGENT_PUBLIC_URL
              value: {{ default (printf "https://%s.%s.svc:%v" (include "durpdeploy.fullname" .) .Release.Namespace .Values.agent.port) .Values.agent.publicURL | quote }}
            - name: DURPDEPLOY_AGENT_IDENTITY_DIR
              value: {{ .Values.agent.identityDir | quote }}
            {{- if .Values.containerRuntime.enabled }}
            - name: DURPDEPLOY_CONTAINER_RUNTIME
              value: {{ required "containerRuntime.type is required" .Values.containerRuntime.type | quote }}
            - name: DURPDEPLOY_CONTAINER_URL
              value: {{ required "containerRuntime.url is required" .Values.containerRuntime.url | quote }}
            - name: DURPDEPLOY_CONTAINER_NAMESPACE
              value: {{ required "containerRuntime.namespace is required" .Values.containerRuntime.namespace | quote }}
            {{- end }}
            {{- if .Values.oidc.enabled }}
            - name: DURPDEPLOY_URL
              value: {{ required "oidc.publicURL is required when OIDC is enabled" .Values.oidc.publicURL | quote }}
            # OIDC callback: https://durpdeploy.example.com/login/oidc/callback
            # OIDC scopes are fixed by the application: openid profile email.
            - name: DURPDEPLOY_OIDC_ISSUER
              value: {{ .Values.oidc.issuer | quote }}
            - name: DURPDEPLOY_OIDC_CLIENT_ID
              value: {{ .Values.oidc.clientID | quote }}
            - name: DURPDEPLOY_OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ required "oidc.clientSecret.existingSecret is required when OIDC is enabled" .Values.oidc.clientSecret.existingSecret | quote }}
                  key: {{ required "oidc.clientSecret.key is required when OIDC is enabled" .Values.oidc.clientSecret.key | quote }}
            - name: DURPDEPLOY_OIDC_ADMIN_GROUP
              value: {{ .Values.oidc.adminGroup | quote }}
            - name: DURPDEPLOY_OIDC_DEPLOYER_GROUP
              value: {{ .Values.oidc.deployerGroup | quote }}
            - name: DURPDEPLOY_OIDC_VIEWER_GROUP
              value: {{ .Values.oidc.viewerGroup | quote }}
            - name: DURPDEPLOY_OIDC_DISPLAY_NAME
              value: {{ .Values.oidc.displayName | quote }}
            - name: DURPDEPLOY_OIDC_GROUP_CLAIM
              value: {{ .Values.oidc.groupClaim | quote }}
            - name: DURPDEPLOY_OIDC_REQUIRE_EMAIL_VERIFIED
              value: {{ ternary "true" "false" .Values.oidc.requireEmailVerified | quote }}
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          livenessProbe:
            {{- toYaml .Values.probes.liveness | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.probes.readiness | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          # /tmp is needed by the runner for tmp files; /data is a
          # historical volume for SQLite (unused on Postgres but kept
          # for parity with the systemd unit).
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: data
              mountPath: /data
            - name: agent-identity
              mountPath: {{ .Values.agent.identityDir }}
            {{- if .Values.containerRuntime.enabled }}
            - name: container-runtime-ssh
              mountPath: /home/durpdeploy/.ssh
              readOnly: true
            {{- end }}
      volumes:
        - name: tmp
          emptyDir: {}
        - name: data
          emptyDir: {}
        - name: agent-identity
          persistentVolumeClaim:
            claimName: {{ include "durpdeploy.agentIdentityClaimName" . }}
        {{- if .Values.containerRuntime.enabled }}
        - name: container-runtime-ssh-secret
          secret:
            secretName: {{ required "containerRuntime.sshSecret is required" .Values.containerRuntime.sshSecret | quote }}
            defaultMode: 0440
        - name: container-runtime-ssh
          emptyDir: {}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
