image: golang:1.26-alpine@sha256:0178a641fbb4858c5f1b48e34bdaabe0350a330a1b1149aabd498d0699ff5fb2

# Tests spin up real bash via os/exec to run deployment scripts. The alpine
# base image doesn't ship bash by default, so install it before any stage
# that runs the test suite.
stages:
  - lint
  - test
  - build
  - docker

default:
  before_script:
    - apk add --no-cache bash

lint:
  stage: lint
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  before_script:
    - go install github.com/a-h/templ/cmd/templ@v0.3.1020
    - templ generate
    # ponytail: static/swagger-ui/ is gitignored (build artifacts from
    # node_modules/swagger-ui-dist), so the //go:embed pattern in
    # static/static.go finds no files on a fresh CI checkout. Run the
    # make target to materialize them before go vet walks the import graph.
    - apk add --no-cache make nodejs npm
    - make swagger-ui-copy
  script:
    - go vet ./...
    - test -z "$(gofmt -l .)"
    # ponytail: same gate as scripts/pre-commit. --no-verify bypasses the
    # local hook but can't bypass CI; line-width drift is caught here.
    - go install github.com/segmentio/golines@v0.13.0
    - test -z "$(golines -m 80 --ignore-generated -l .)"
  allow_failure: false

# Dockerfile lint. Runs on every pipeline so a bad Dockerfile fails fast.
lint:dockerfile:
  stage: lint
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  image: hadolint/hadolint:latest-alpine
  script:
    - hadolint --failure-threshold warning Dockerfile
  needs: []

golang:test:
  stage: test
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  before_script:
    # ponytail: tests spawn the deployment runner, which exec's `bash` to run step scripts. The `default.before_script` doesn't reliably run in this Kubernetes executor, so install explicitly.
    - apk add --no-cache bash make nodejs npm util-linux
    - go install github.com/a-h/templ/cmd/templ@v0.3.1020
    - templ generate
    # ponytail: static/swagger-ui/ is gitignored; materialize it before the test build walks the import graph.
    - make swagger-ui-copy
  script:
    # ponytail: regex captures only the last package's coverage; use `go tool cover -func coverage.txt` for the cumulative number.
    - go test -v -count=1 -cover -coverprofile=coverage.txt ./...
  coverage: '/\d+\.\d+% of statements/'
#  artifacts:
#    paths:
#      - coverage.txt
#    expire_in: 1 week

# The browser image is built from Dockerfile.mobile-browser for this job. The
# Docker-in-Docker daemon cannot bind-mount the checkout, so copy it into a
# created container and copy only its secret-free artifacts back afterward.
mobile:browser:
  stage: test
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  image: docker:24
  services:
    - name: docker:24-dind
      alias: docker
      command: ["--tls=false"]
  resource_group: mobile-browser
  variables:
    DOCKER_TLS_CERTDIR: ""
    DOCKER_HOST: tcp://docker:2375
    MOBILE_BROWSER_IMAGE: "$CI_REGISTRY_IMAGE/mobile-browser:$CI_COMMIT_SHA"
    MOBILE_BROWSER_CONTAINER: "mobile-browser-$CI_JOB_ID"
  before_script:
    - |
      for attempt in $(seq 1 30); do
        if docker info >/dev/null 2>&1; then
          break
        fi
        if [ "$attempt" -eq 30 ]; then
          echo 'mobile:browser: Docker daemon did not become ready after 30 seconds' >&2
          docker info 2>&1 || true
          exit 1
        fi
        sleep 1
      done
    - docker build -f Dockerfile.mobile-browser -t "$MOBILE_BROWSER_IMAGE" .
    - >-
      docker create --name "$MOBILE_BROWSER_CONTAINER"
      --entrypoint /usr/local/bin/mobile-browser-container
      -e MOBILE_RUN_ID="gitlab-$CI_JOB_ID"
      -e MOBILE_ARTIFACT_DIR=/artifacts
      "$MOBILE_BROWSER_IMAGE"
    - docker cp "$CI_PROJECT_DIR/." "$MOBILE_BROWSER_CONTAINER:/workspace"
  script:
    - docker start -a "$MOBILE_BROWSER_CONTAINER"
  after_script:
    - |
      set +e
      if ! docker info >/tmp/mobile-browser-docker-info 2>&1; then
        echo 'mobile:browser after_script: Docker daemon unavailable; skipping failure diagnostics and container cleanup.' >&2
        cat /tmp/mobile-browser-docker-info >&2
        rm -f /tmp/mobile-browser-docker-info
        exit 0
      fi
      if docker container inspect "$MOBILE_BROWSER_CONTAINER" >/dev/null 2>&1; then
        if [ "$CI_JOB_STATUS" = failed ]; then
          echo 'mobile:browser failure diagnostics (capped at 32 KiB):' >&2
          docker exec "$MOBILE_BROWSER_CONTAINER" sh -c '
            find /artifacts -type f -name "mobile-readability-*.json" -size -33k \
              -print -exec cat {} \;
          ' 2>&1 | head -c 32768 || true
        fi
        docker rm -f "$MOBILE_BROWSER_CONTAINER" ||
          echo 'mobile:browser after_script: container cleanup failed.' >&2
      else
        echo "mobile:browser after_script: container $MOBILE_BROWSER_CONTAINER was not found; nothing to copy or remove." >&2
      fi
      rm -f /tmp/mobile-browser-docker-info
auth:mfa-sqlite:
  stage: test
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  image: docker:24
  services:
    - name: docker:24-dind
      alias: docker
      command: ["--tls=false"]
  resource_group: auth-mfa-e2e
  variables:
    DOCKER_TLS_CERTDIR: ""
    DOCKER_HOST: tcp://docker:2375
    AUTH_MFA_IMAGE: "$CI_REGISTRY_IMAGE/auth-mfa-e2e:$CI_COMMIT_SHA"
    AUTH_MFA_CONTAINER: "auth-mfa-e2e-$CI_JOB_ID"
  before_script:
    - |
      for attempt in $(seq 1 30); do
        if docker info >/dev/null 2>&1; then
          break
        fi
        if [ "$attempt" -eq 30 ]; then
          echo 'auth:mfa-sqlite: Docker daemon did not become ready after 30 seconds' >&2
          docker info 2>&1 || true
          exit 1
        fi
        sleep 1
      done
    - docker build -f Dockerfile.mobile-browser -t "$AUTH_MFA_IMAGE" .
    - docker create --name "$AUTH_MFA_CONTAINER" --entrypoint sleep "$AUTH_MFA_IMAGE" infinity
    - docker cp "$CI_PROJECT_DIR/." "$AUTH_MFA_CONTAINER:/workspace"
  script:
    - docker start "$AUTH_MFA_CONTAINER"
    - >-
      docker exec
      -e NODE_PATH=/opt/mobile-browser/node_modules
      "$AUTH_MFA_CONTAINER"
      sh -ec
      'ln -s /opt/mobile-browser/node_modules node_modules &&
      mkdir -p static/swagger-ui &&
      cp /opt/mobile-browser/node_modules/swagger-ui-dist/swagger-ui-bundle.js static/swagger-ui/ &&
      cp /opt/mobile-browser/node_modules/swagger-ui-dist/swagger-ui-standalone-preset.js static/swagger-ui/ &&
      cp /opt/mobile-browser/node_modules/swagger-ui-dist/swagger-ui.css static/swagger-ui/ &&
      cp /opt/mobile-browser/node_modules/swagger-ui-dist/favicon-32x32.png static/swagger-ui/ &&
      cp /opt/mobile-browser/node_modules/swagger-ui-dist/favicon-16x16.png static/swagger-ui/ &&
      make auth-mfa-e2e-sqlite'
  after_script:
    - |
      set +e
      if docker info >/dev/null 2>&1 && docker container inspect "$AUTH_MFA_CONTAINER" >/dev/null 2>&1; then
        if [ "$CI_JOB_STATUS" = failed ] && docker exec "$AUTH_MFA_CONTAINER" test -d /workspace/artifacts; then
          echo 'auth:mfa-sqlite failure diagnostics (capped at 32 KiB):' >&2
          docker exec "$AUTH_MFA_CONTAINER" sh -c '
            find /workspace/artifacts -type f \( -name summary.txt -o -name "*.redacted.log" -o -name trace.redacted.json \) -size -33k \
              -print -exec cat {} \;
          ' 2>&1 | head -c 32768 || true
        fi
        docker rm -f "$AUTH_MFA_CONTAINER" || true
      fi

auth:mfa-parity:
  stage: test
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  image: golang:1.26-bookworm
  services:
    - name: docker:24-dind
      alias: docker
      command: ["--tls=false"]
  resource_group: auth-mfa-e2e
  variables:
    DOCKER_TLS_CERTDIR: ""
    DOCKER_HOST: tcp://docker:2375
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends bash docker.io make nodejs npm && rm -rf /var/lib/apt/lists/*
    - go install github.com/a-h/templ/cmd/templ@v0.3.1020
    - templ generate
    - make swagger-ui-copy
    - |
      for attempt in $(seq 1 30); do
        if docker info >/dev/null 2>&1; then
          break
        fi
        if [ "$attempt" -eq 30 ]; then
          echo 'auth:mfa-parity: Docker daemon did not become ready after 30 seconds' >&2
          docker info 2>&1 || true
          exit 1
        fi
        sleep 1
      done
  script:
    - make auth-mfa-e2e-postgres auth-mfa-e2e-mssql
  after_script:
    - |
      set +e
      if [ "$CI_JOB_STATUS" = failed ] && [ -d artifacts/auth-mfa ]; then
        echo 'auth:mfa-parity failure diagnostics (capped at 32 KiB):' >&2
        find artifacts/auth-mfa -type f \( -name summary.txt -o -name '*.redacted.log' -o -name trace.redacted.json \) -size -33k \
          -print -exec cat {} \; 2>&1 | head -c 32768 || true
      fi
      if docker info >/dev/null 2>&1; then
        docker ps --filter 'label=org.testcontainers=true' -q | xargs -r docker rm -f || true
      fi

build:
  stage: build
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  image: golang:1.26-alpine@sha256:0178a641fbb4858c5f1b48e34bdaabe0350a330a1b1149aabd498d0699ff5fb2
  services:
    - name: docker:24-dind
      alias: docker
      command: ["--tls=false"]
  variables:
    DOCKER_TLS_CERTDIR: ""
    DOCKER_HOST: tcp://docker:2375
  before_script:
    - apk add --no-cache docker-cli
    - go install github.com/a-h/templ/cmd/templ@v0.3.1020
    - templ generate
    # ponytail: static/swagger-ui/ is gitignored; materialize it before the build.
    - apk add --no-cache make nodejs npm
    - make swagger-ui-copy
    - |
      for attempt in $(seq 1 30); do
        if docker info >/dev/null 2>&1; then
          break
        fi
        if [ "$attempt" -eq 30 ]; then
          echo 'build: docker daemon did not become ready after 30 seconds' >&2
          docker info 2>&1 || true
          exit 1
        fi
        sleep 1
      done
  script:
    - go build -o durpdeploy ./cmd/server
  # artifacts:
  #   paths:
  #     - durpdeploy
  #   expire_in: 1 week
  needs: ["lint", "golang:test"]

# Multi-arch (linux/amd64, linux/arm64) image build + push to the GitLab
