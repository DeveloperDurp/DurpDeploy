coverage:
  extends: .mr-test
  timeout: 45 minutes
  parallel:
    matrix:
      - COVERAGE_SHARD: [api-1, api-2, handlers, repository, migrations, core]
  script:
    - make templ-generate swagger-ui-copy
    - |-
      mkdir -p artifacts/coverage
      package_shard=$COVERAGE_SHARD
      selection=()
      if [[ $COVERAGE_SHARD == api-* ]]; then
        package_shard=api
        tests=$(bash scripts/ci_coverage_tests.sh "${COVERAGE_SHARD##*-}")
        expression=${tests//$'\n'/|}
        selection=(-run "^($expression)$")
      fi
      package_list=$(bash scripts/ci_coverage_packages.sh "$package_shard")
      test -n "$package_list"
      mapfile -t packages <<< "$package_list"
      bash scripts/go_test.sh -tags=e2e -count=1 -timeout=30m \
        -covermode=atomic -coverpkg=./... \
        -coverprofile="artifacts/coverage/$COVERAGE_SHARD.out" "${selection[@]}" "${packages[@]}"
    - if [[ $COVERAGE_SHARD == core ]]; then bash scripts/build_version_test.sh; fi
  artifacts:
    expire_in: 4 hours
    paths: [artifacts/coverage/]

sonarcloud:
  stage: verify
  image:
    name: harbor.durp.info/dockerhub/sonarsource/sonar-scanner-cli@sha256:a3f4215076706c95a17a68c19322ee916e40a3acd081a8c1a1e839e0194afa57
    entrypoint: [""]
  needs: [coverage]
  artifacts:
    paths: []
  before_script:
    - unset GHCR_TOKEN GHCR_USER
  cache: []
  timeout: 15 minutes
  environment:
    name: sonar
    action: prepare
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_SOURCE_PROJECT_ID == $CI_PROJECT_ID'
  script:
    - test -n "$SONAR_TOKEN"
    - |-
      for shard in api-1 api-2 handlers repository migrations core; do
        test -s "artifacts/coverage/$shard.out"
      done
      sonar-scanner -Dsonar.qualitygate.wait=true \
        -Dsonar.go.coverage.reportPaths=artifacts/coverage/api-1.out,artifacts/coverage/api-2.out,artifacts/coverage/handlers.out,artifacts/coverage/repository.out,artifacts/coverage/migrations.out,artifacts/coverage/core.out \
        -Dsonar.pullrequest.key="gitlab-$CI_MERGE_REQUEST_IID" \
        -Dsonar.pullrequest.branch="$CI_MERGE_REQUEST_SOURCE_BRANCH_NAME" \
        -Dsonar.pullrequest.base="$CI_MERGE_REQUEST_TARGET_BRANCH_NAME"
