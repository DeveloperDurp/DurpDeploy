version: "2"
sql:
  - engine: "sqlite"
    schema: "migrations"
    queries: "queries"
    gen:
      go:
        package: "db"
        out: "internal/db"
        emit_json_tags: true
        overrides:
          - column: "deployment_logs.is_step_metadata"
            go_type: "int64"
            go_struct_tag: 'json:"-"'
