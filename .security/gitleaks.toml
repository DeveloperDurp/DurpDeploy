title = "DurpDeploy secret scanning"
# Exception owner: DeveloperDurp
# Exceptions expire: 2027-01-01

[extend]
useDefault = true

# Exact inert canaries used to prove HTTP hostname/stream redaction.
# AND is essential: other values in these test files still fail.
[[allowlists]]
description = "Reviewed redaction-test hostname canaries; no issued credentials"
condition = "AND"
targetRules = ["generic-api-key"]
paths = ['''^internal/(handler/api/verification_encryption_e2e_test|runner/verification_http_scrubber_test)\.go$''']
regexes = ['''(?i)^(api\.apikey-123456789|apikey-123456789|key-123456789)$''']

[[allowlists]]
description = "Reviewed fixed bearer canary in the scrubber regression test"
condition = "AND"
targetRules = ["curl-auth-header"]
paths = ['''^internal/runner/scrubber_test\.go$''']
regexes = ['''^abc\.123-XYZ_456=$''']

[[allowlists]]
description = "Reviewed alphabetic AWS-format canary in scrubber regressions"
condition = "AND"
targetRules = ["aws-access-token"]
paths = ['''^internal/(runner/scrubber_test|logscrub/default_prefix_test|repository/remote_log_prefix_test|agentserver/log_prefix_redaction_test|handler/api/step_logs_browser_test)\.go$''']
regexes = ['''^AKIAABCDEFGHIJKLMNOP$''']

# The Slack scanner extracts only xoxa-synthetic. Match the complete source
# line so another credential with that prefix cannot use this exception.
[[allowlists]]
description = "Reviewed fixed Slack-format canary in split-prefix regressions"
condition = "AND"
targetRules = ["slack-legacy-workspace-token"]
paths = ['''^internal/(logscrub/default_prefix_test|repository/remote_log_prefix_test|agentserver/log_prefix_redaction_test)\.go$''']
regexTarget = "line"
regexes = ['''^\s*"xoxa-synthetic-proof",(?: "xoxp-synthetic-proof",)?$''']

[[allowlists]]
description = "Reviewed fixed Slack-format output in the step-log browser test"
condition = "AND"
targetRules = ["slack-legacy-workspace-token"]
paths = ['''^internal/handler/api/step_logs_browser_test\.go$''']
regexTarget = "line"
regexes = ['''^\s*"0xoxa-synthetic-proof\\n0xoxp-synthetic-proof\\n"$''']

[[allowlists]]
description = "Reviewed inert GitLab-format canary in provenance rejection tests"
condition = "AND"
targetRules = ["gitlab-pat"]
paths = ['''^internal/provenance/source_test\.go$''']
regexTarget = "line"
regexes = [
  '''^\s*"gitlab token":\s*\{ArtifactRef: "glpat-1234567890abcdefghijkl"\},$''',
  '''^\s*"encoded token":\s*\{CIRunURL: "https://ci\.example\.test/(%67|g)lpat-1234567890abcdefghijkl"\},$''',
]
