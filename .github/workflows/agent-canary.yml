# Agent canary: weekly drift check against durpdeploy-agent main.
#
# The agent module lives in its own repo and its CI cannot see this one.
# This scheduled job builds durpdeploy-agent@main and drives the real
# paired-agent harness (mTLS pairing, poll/start/heartbeat/result, mixed
# bash+python3 execution) so an agent change that breaks the DurpDeploy
# contract surfaces within a week instead of at rollout.
#
# The pin-based PR gate (agent smoke / rollout) still guards the module
# version this repo consumes; this workflow only detects forward drift.
#
# Permission split: the canary job runs unpinned agent code, so it holds
# contents: read only. Issue reporting lives in a dependent job that
# alone receives issues: write, so a compromised agent branch cannot
# intercept a token that can open issues.
name: agent-canary

on:
  schedule:
    # Weekly, Monday 06:17 UTC.
    - cron: '17 6 * * 1'
  workflow_dispatch: {}

permissions:
  contents: read

# Never cancel an in-progress canary: a partial run would look like a
# contract failure.
concurrency:
  group: agent-canary
  cancel-in-progress: false

jobs:
  canary:
    name: Agent main canary
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    outputs:
      # Recorded for the notify job: on early failure or timeout the
      # values stay empty and the comment says so instead of inventing
      # provenance.
      agent_sha: ${{ steps.agent_sha.outputs.sha }}
      evidence: ${{ steps.evidence.outputs.status }}
    env:
      # Host-process mode runs the freshly built agent directly on the
      # runner. GitHub runners ship python3 and pwsh, so the
      # --mixed-interpreter deployment takes the success path and the
      # canary exercises the full bash+python3 capability contract.
      DURPDEPLOY_AGENT_E2E_HOST_PROCESS: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.26.8'
          cache: true

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      # The harness builds ./cmd/server itself; embedded views and
      # swagger assets must exist first (same reason as release.yml).
      # swagger-ui-copy runs npm ci --ignore-scripts, which populates
      # node_modules (playwright included) without browser downloads.
      # templ runs from the digest-pinned image rather than `go install`
      # (Sonar githubactions:S8545) — same pattern as release.yml.
      - name: Generate templ files
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --volume "$PWD:/workspace" \
            --workdir /workspace \
            ghcr.io/a-h/templ@sha256:2e266c40e32de7fa67e08018a06675975ccb7e86110dae7a7c0b0131adaab41d \
            generate

      - name: Materialize static/swagger-ui/
        run: make swagger-ui-copy

      - name: Install Chromium for the harness browser
        run: ./node_modules/.bin/playwright install --with-deps chromium

      - name: Check out durpdeploy-agent main
        run: |
          git clone --depth 1 \
            https://github.com/DeveloperDurp/durpdeploy-agent \
            "$GITHUB_WORKSPACE/../durpdeploy-agent-main"

      - name: Record agent revision
        id: agent_sha
        run: echo "sha=$(git -C \"$GITHUB_WORKSPACE/../durpdeploy-agent-main\" rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Run paired-agent canary (happy)
        env:
          DURPDEPLOY_AGENT_WORKTREE: ${{ github.workspace }}/../durpdeploy-agent-main
        run: bash scripts/agent_e2e_test.sh

      # --mixed-interpreter ships with the harness in PR #79. Gate on the
      # flag so the canary fails with an explicit dependency message
      # instead of an opaque "unknown argument" (issue #84's skip-free
      # rule: a canary that cannot exercise the mode must stay red).
      - name: Run paired-agent canary (mixed-interpreter)
        env:
          DURPDEPLOY_AGENT_WORKTREE: ${{ github.workspace }}/../durpdeploy-agent-main
        run: |
          if ! grep -q -- '--mixed-interpreter' scripts/agent_e2e_test.sh; then
            printf '%s\n' \
              'agent-canary: --mixed-interpreter mode is not in main yet (merge PR #79 first); failing the canary so the missing mode stays visible.' >&2
            exit 1
          fi
          bash scripts/agent_e2e_test.sh --mixed-interpreter

      - name: Upload harness evidence
        id: upload
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: agent-canary-evidence
          path: .omo/evidence/continue-remote-agent-rollout/
          retention-days: 7
          if-no-files-found: ignore

      # Status derives from the upload outcome: a failed upload must
      # not be advertised as a usable diagnostic (artifact-service
      # outages happen).
      - name: Record evidence status
        id: evidence
        if: always()
        env:
          UPLOADED: ${{ steps.upload.outcome == 'success' }}
        run: |
          files=$(find .omo/evidence/continue-remote-agent-rollout -type f 2>/dev/null | head -1)
          if [ "$UPLOADED" = "true" ] && [ -n "$files" ]; then
            echo "status=agent-canary-evidence artifact uploaded" >> "$GITHUB_OUTPUT"
          elif [ "$UPLOADED" = "true" ]; then
            echo "status=no evidence captured" >> "$GITHUB_OUTPUT"
          else
            echo "status=evidence upload failed" >> "$GITHUB_OUTPUT"
          fi

  # Failure/timeout reporting must not live in the canary job: a job
  # killed at its 45-minute timeout never reaches a later same-job step.
  notify:
    name: Record failure on issue #84
    needs: canary
    if: always() &&
      (needs.canary.result == 'failure' ||
        needs.canary.result == 'timed_out')
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Comment on the canary issue
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ needs.canary.result }}
          AGENT_SHA: ${{ needs.canary.outputs.agent_sha }}
          EVIDENCE: ${{ needs.canary.outputs.evidence }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          sha="${AGENT_SHA:-unknown: canary ended before recording the agent revision}"
          gh issue comment 84 --repo "${{ github.repository }}" --body \
            "agent-canary ${RESULT} against durpdeploy-agent main at ${sha}; evidence: ${EVIDENCE:-none}. Run: ${RUN_URL}"
